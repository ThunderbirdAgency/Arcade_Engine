<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061714"><meta name="description" content="ArcadeEngine: playable cartoons. Watch the danger, make your move, and live the story."><title>ArcadeEngine · Play the story</title><link rel="stylesheet" href="/arcade.css"></head>
<body><header class="mast"><a href="/play/" class="brand">ARCADE<span>ENGINE</span><small>PLAY THE STORY</small></a><nav aria-label="Player controls"><a href="/studio/" class="navlink">Workshop</a><button id="sound" aria-pressed="true">Sound on</button><button id="pause" hidden>Pause Ⅱ</button><button id="fullscreen">Full screen ↗</button></nav></header>
<main id="cabinet">
 <div class="screen"><img id="poster" src="" alt=""><video id="film-a" playsinline preload="auto" hidden></video><video id="film-b" playsinline preload="auto" hidden></video><div class="shade"></div></div>
 <div class="hud"><span id="chapter"></span><span id="lives" hidden></span></div>
 <section id="title-card" class="title-card"><p id="title-eyebrow" class="eyebrow">A PLAYABLE CARTOON</p><h1 id="title-name">ARCADE<br><em>ENGINE</em></h1><p id="title-tagline" class="intro"></p><button id="start" class="gold">Start the story <span>→</span></button><div class="mode"><label for="difficulty">Play style</label><select id="difficulty"><option value="arcade">Arcade · timed moves, 3 lives</option><option value="guided">Guided · pause at every move</option></select></div><p class="how">Watch the cartoon. When the cue appears,<br>tap a move or use the arrow keys and space.</p><div id="other-games" class="links"></div><div id="links" class="links"></div></section>
 <section id="cue-panel" class="cue-panel" hidden aria-labelledby="cue-text"><p class="eyebrow">YOUR MOVE</p><h2 id="cue-text"></h2><div id="countdown" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="time-bar"></div></div><div id="moves" class="moves"></div></section>
 <div id="toast" class="toast" role="status" aria-live="polite"></div>
 <section id="overlay" class="overlay" hidden aria-labelledby="overlay-title"><div class="overlay-card"><p id="overlay-kicker" class="eyebrow"></p><h2 id="overlay-title" tabindex="-1"></h2><p id="overlay-copy"></p><div id="overlay-extra"></div><div id="overlay-actions"></div></div></section>
 <footer class="film-footer"><span id="status">ORIGINAL ART · ANIMATED ADVENTURE</span><span id="room-count"></span></footer>
</main><footer class="below"><span>Watch carefully. Choose bravely.</span><button id="restart" hidden>Restart ↺</button><span id="disclaimer" class="fiction"></span></footer>
<script type="module" src="/engine/player.mjs"></script></body></html>
